---
- name: Setup Jenkins EC2 with all DevSecOps tools
  hosts: jenkins
  become: yes

  roles:
    - java        # Must be first — Jenkins depends on Java
    - jenkins     # Creates jenkins user and starts service
    - docker      # Adds jenkins user to docker group + installs Docker Scout
    - sonarqube   # Runs SonarQube as Docker container on port 9000
    - awscli      # AWS CLI v2 for EKS access
    - kubectl     # kubectl v1.33 matching EKS version
    - helm        # Helm 3 for deploying to EKS
