{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotstar
  labels:
    app: hotstar
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http: 
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotstar
                port:
                  number: {{ .Values.service.port }}
{{- end }}
