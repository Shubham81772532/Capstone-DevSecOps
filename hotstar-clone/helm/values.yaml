replicaCount: 2

image:
  repository: shubhamnavale8177/hotstar
  tag: "1"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

containerPort: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: hotstar.local
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

resourceQuota:
  enabled: true
  requests:
    cpu: "2"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"
  pods: "20"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "250m"
    memory: "256Mi"
  max:
    cpu: "2"
    memory: "2Gi"